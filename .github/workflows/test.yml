name: Test

# Builds the npm packages from the executables of a HeadlessMc release and runs HeadlessMc through them
# on every supported platform. Also called by the publish workflow before publishing.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag of headlesshq/headlessmc (defaults to the latest release)
        required: false
  workflow_call:
    inputs:
      tag:
        description: Release tag of headlesshq/headlessmc
        type: string
        required: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: headlessmc-launcher-linux-x64
          # installed and run with the node of Alpine Linux, so that npm picks the musl package
          - runner: ubuntu-latest
            asset: headlessmc-launcher-linux-x64-musl
            container: node:24-alpine
          - runner: ubuntu-24.04-arm
            asset: headlessmc-launcher-linux-arm64
          - runner: macos-15-intel
            asset: headlessmc-launcher-macos-x64
          - runner: macos-latest
            asset: headlessmc-launcher-macos-arm64
          - runner: windows-latest
            asset: headlessmc-launcher-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24

      - name: Download executable
        id: download
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            TAG=$(gh release list --repo headlesshq/headlessmc --exclude-drafts --limit 1 --json tagName -q '.[0].tagName')
          fi
          echo "Testing HeadlessMc $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          gh release download "$TAG" --repo headlesshq/headlessmc --dir dist --pattern '${{ matrix.asset }}'

      - name: Build and install npm packages
        env:
          TAG: ${{ steps.download.outputs.tag }}
          CONTAINER: ${{ matrix.container }}
        run: |
          node scripts/build-packages.mjs --partial "$TAG" dist npm-out
          mkdir npm-tgz
          for package in npm-out/*/; do
            npm pack "$package" --pack-destination npm-tgz
          done
          if [[ -n "$CONTAINER" ]]; then
            # npm install in the container, see the next step
            exit 0
          fi
          prefix="$RUNNER_TEMP/npm"
          npm install -g --prefix "$prefix" ./npm-tgz/*.tgz
          # npm puts global executables into <prefix>/bin, except on Windows
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$prefix" >> "$GITHUB_PATH"
          else
            echo "$prefix/bin" >> "$GITHUB_PATH"
          fi

      - name: Run HeadlessMc from npm
        if: '!matrix.container'
        run: bash scripts/test-installed.sh "${{ steps.download.outputs.tag }}" "$RUNNER_TEMP/hmc"

      - name: Run HeadlessMc from npm in ${{ matrix.container }}
        if: matrix.container
        env:
          CONTAINER: ${{ matrix.container }}
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work "$CONTAINER" sh -euc '
            apk add --no-cache bash
            npm install -g ./npm-tgz/*.tgz
            bash scripts/test-installed.sh "$1" /tmp/hmc' sh "${{ steps.download.outputs.tag }}"
